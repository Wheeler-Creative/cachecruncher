name: Deploy manual website change

on:
  push:
    branches: [main]
    # Owner-console values resolve from R2 immediately. Their Git mirror is an
    # audit/source-control record, not a source deployment, so do not spend a
    # full build-and-deploy run for a phone-number or crop adjustment.
    paths-ignore:
      - ".wheelerswebsites/**"
  workflow_dispatch:

concurrency:
  group: managed-manual-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.source.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: |
          subject=$(git log -1 --pretty=%s)
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$subject" =~ ^Website\ request\ [0-9a-fA-F-]{36}$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: source
    if: ${{ needs.source.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci; else npm install --no-package-lock; fi
      - name: Validate manual change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build --if-present
          npm run build:data --if-present
          npm run lint --if-present
          node scripts/managed-site/site-test-runner.mjs
          npm run check --if-present
          node --check src/worker.js
          npx wrangler deploy --dry-run
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build --if-present
          npx wrangler deploy --keep-vars
      - name: Record which media the deployed site links to
        if: ${{ hashFiles('scripts/managed-site/media-links.mjs') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/managed-site/media-links.mjs --publish
