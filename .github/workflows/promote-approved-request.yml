name: Promote approved website request
# Named after the request, so the platform can find the run a dispatch created (src/publish-recovery.js).
run-name: publish-edit ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Supabase request id
        required: true
        type: string

concurrency:
  group: managed-promotion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  find-request:
    runs-on: ubuntu-latest
    outputs:
      request_id: ${{ steps.find.outputs.request_id }}
      request_branch: ${{ steps.find.outputs.request_branch }}
      preview_worker_name: ${{ steps.find.outputs.preview_worker_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci; else npm install --no-package-lock; fi
      - id: find
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/managed-site/find-approved.mjs

  promote:
    needs: find-request
    if: ${{ needs.find-request.outputs.request_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # gh pr checks reads the PR's statusCheckRollup and each check's workflow run; unlisted scopes are "none".
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-request.outputs.request_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci; else npm install --no-package-lock; fi
      - name: Validate approved branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build --if-present
          npm run build:data --if-present
          node scripts/managed-site/site-test-runner.mjs
          npm run check --if-present
          node --check src/worker.js
          npx wrangler deploy --dry-run
          if [ -f scripts/managed-site/media-links.mjs ]; then
            git fetch -q origin main
            node scripts/managed-site/media-links.mjs --check origin/main
          fi
      - name: Collect change details
        id: change
        run: |
          git fetch origin main
          {
            echo "files<<EOF"
            git diff --name-only origin/main...HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "summary=$(git log -1 --pretty=%s | tr -d '\n' | cut -c1-200)" >> "$GITHUB_OUTPUT"
      - name: Wait for the accessibility gate on the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ needs.find-request.outputs.request_branch }}"
          # The credential-free gate scans the pull request and reports. An
          # approved request must not merge over a red gate: publishing a
          # site that fails its own accessibility check is exactly what this
          # workflow exists to prevent. The gate is path-filtered to pages and
          # styles, so an edit touching neither (e.g. only a script) registers
          # no checks; gh reports that as exit 1 "no checks reported", not as
          # a failed check. Any real failure fails the promotion.
          log="$RUNNER_TEMP/pr-checks.log"
          watch_checks() {
            status=0
            gh pr checks "$branch" --watch --interval 30 >"$log" 2>&1 || status=$?
            cat "$log"
          }
          no_checks() { [ "$status" -ne 0 ] && grep -q "no checks reported" "$log"; }
          watch_checks
          if no_checks; then
            # A just-opened pull request can register its checks late.
            sleep 20
            watch_checks
          fi
          if no_checks; then
            echo "No checks registered on this pull request; continuing."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "Checks failed on $branch (exit $status); refusing to merge."
            exit "$status"
          fi
      - name: Merge approved pull request
        env:
          # The workflow is merging a PR in its own repository. The built-in
          # token is scoped to exactly that repository and avoids requiring a
          # separately copied MANAGED_SITE_GITHUB_TOKEN secret on every site.
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ needs.find-request.outputs.request_branch }}" --squash --delete-branch
      - name: Deploy merged main branch
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-package-lock; fi
          npm run build --if-present
          npm run build:data --if-present
          node scripts/managed-site/site-test-runner.mjs
          npx wrangler deploy --dry-run
          npx wrangler deploy --keep-vars
      - name: Mark deployed
        env:
          REQUEST_ID: ${{ needs.find-request.outputs.request_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/managed-site/update-request.mjs deployed
      - name: Record which media the deployed site links to
        if: ${{ hashFiles('scripts/managed-site/media-links.mjs') != '' }}
        # Already live and marked deployed; the image manager re-reads usage on the next deploy.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/managed-site/media-links.mjs --publish
      - name: Remove preview worker
        if: ${{ needs.find-request.outputs.preview_worker_name != '' }}
        id: preview_cleanup
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_WORKER_NAME: ${{ needs.find-request.outputs.preview_worker_name }}
        run: node scripts/managed-site/delete-preview-worker.mjs
      - name: Record preview cleanup
        if: ${{ steps.preview_cleanup.outcome == 'success' }}
        env:
          REQUEST_ID: ${{ needs.find-request.outputs.request_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/managed-site/update-request.mjs preview-cleaned
      - name: Record site memory
        continue-on-error: true
        env:
          REQUEST_ID: ${{ needs.find-request.outputs.request_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHANGED_FILES: ${{ steps.change.outputs.files }}
          CHANGE_SUMMARY: ${{ steps.change.outputs.summary }}
        run: node scripts/managed-site/record-change.mjs deployed
      - name: Mark failed
        if: ${{ failure() }}
        env:
          REQUEST_ID: ${{ needs.find-request.outputs.request_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/managed-site/update-request.mjs failed
