name: Refresh managed code index

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: managed-code-index-${{ github.repository }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [[ -f package-lock.json ]]; then npm ci; else npm install --no-package-lock; fi
      - name: Refresh searchable source context
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/managed-site/index-code.mjs
